<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#58b4e8">
  <meta name="description" content="Vertigo Rush - a 3D parkour racing game that runs in the browser.">
  <title>Vertigo Rush</title>
  <link rel="stylesheet" href="./styles.css">
  <!--
    three.js is vendored, not fetched: the game has no build step and no network
    dependency.

    There is deliberately no import map. There used to be one, mapping "three"
    to the vendored file, and it made the game silently dead on any browser that
    does not support import maps - Safari before 16.4, among others. The menu is
    static markup, so the page still rendered and every button did nothing,
    which is indistinguishable from the game ignoring you.

    Relative specifiers need no browser feature at all, and cost one longer
    import line in eight view files.
  -->
  <script>
    /*
      A classic script on purpose. If the module graph fails to load at all -
      unsupported syntax, a missing file, a browser too old for something it
      uses - nothing inside a type="module" block can ever run to report it, and
      the failure is completely silent to the player.

      This watchdog is outside the module system, so it survives that.
    */
    (function () {
      var failed = null;
      window.addEventListener('error', function (e) {
        // Only care about failures to fetch/parse a script or module.
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          failed = 'could not load ' + (e.target.src || e.target.href);
        } else if (e && e.message && !failed) {
          failed = e.message;
        }
      }, true);

      window.addEventListener('load', function () {
        setTimeout(function () {
          if (window.__vertigo) return;          // booted fine
          var box = document.getElementById('boot-error');
          if (!box) return;
          box.textContent = 'This browser could not start the game'
            + (failed ? ' (' + failed + ')' : '')
            + '. It needs a browser with WebGL and ES modules - try updating, '
            + 'or open it in another browser.';
          box.hidden = false;
        }, 5000);
      });
    }());
  </script>
</head>
<body>
  <canvas id="game" aria-label="Vertigo Rush game view" role="img"></canvas>

  <div id="hud" aria-live="polite">
    <!-- The whole top of the screen is one instrument: badge, track, flag. -->
    <div id="race-bar">
      <div id="race-badge" aria-label="Stage">1</div>
      <div id="hud-progress" role="progressbar" aria-label="Course progress">
        <div id="hud-progress-fill"></div>
        <div id="hud-progress-runner"></div>
      </div>
      <div id="race-flag" aria-hidden="true"></div>
    </div>

    <div id="rank-big" aria-label="Race position"></div>

    <div class="hud-pills">
      <span class="pill" id="hud-time">0:00.00</span>
      <span class="pill pill-coins"><span class="coin-dot"></span><span id="hud-coins">0</span></span>
    </div>

    <!-- Floating "5TH · NAME" tags projected over each opponent. -->
    <div id="rank-labels" aria-hidden="true"></div>

    <div id="effects" class="effects" aria-live="polite"></div>
    <div id="countdown" aria-live="assertive"></div>
    <div id="toast" aria-live="assertive"></div>
    <div id="hud-state" class="hud-state"></div>
    <div id="debug-stats"></div>
  </div>

  <button type="button" id="pause-button" aria-label="Pause">II</button>

  <div id="pause" class="hidden">
    <div class="panel">
      <h2>Paused</h2>
      <p class="hint" id="pause-detail"></p>
      <button type="button" class="start" id="pause-resume">Resume</button>
      <button type="button" class="ghost" id="pause-restart">Restart</button>
      <button type="button" class="ghost" id="pause-quit">Back to menu</button>
    </div>
  </div>

  <div id="results" class="hidden">
    <div class="panel">
      <div id="results-place" class="results-place"></div>
      <table class="results-table">
        <thead>
          <tr><th>#</th><th>Racer</th><th>Time</th><th>Coins</th></tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <p class="results-notes" id="results-notes"></p>
      <button type="button" class="start" id="results-again">Race again</button>
      <button type="button" class="ghost" id="results-menu">Back to menu</button>
    </div>
  </div>

  <div id="overlay">
    <div class="panel">
      <h1>Vertigo&nbsp;Rush</h1>
      <p class="tagline" id="overlay-tagline">Choose a course</p>
      <p class="wallet" id="wallet"></p>

      <div class="tabs" role="tablist">
        <button type="button" class="tab selected" data-tab="courses" role="tab">Courses</button>
        <button type="button" class="tab" data-tab="runners" role="tab">Runners</button>
        <button type="button" class="tab" data-tab="settings" role="tab">Settings</button>
      </div>

      <div id="tab-courses" class="tab-panel">
        <div id="level-grid" class="level-grid"></div>
      </div>

      <div id="tab-runners" class="tab-panel hidden">
        <div id="character-grid" class="level-grid"></div>
      </div>

      <div id="tab-settings" class="tab-panel hidden">
        <div class="settings">
          <label class="setting">
            <span>Sound</span>
            <input type="checkbox" id="set-audio" checked>
          </label>
          <label class="setting">
            <span>Haptics</span>
            <input type="checkbox" id="set-haptics" checked>
          </label>
          <label class="setting">
            <span>Reduced motion</span>
            <input type="checkbox" id="set-motion">
          </label>
          <label class="setting">
            <span>Tutorial hints</span>
            <input type="checkbox" id="set-tutorial" checked>
          </label>
          <label class="setting">
            <span>Quality</span>
            <select id="set-quality">
              <option value="">Auto</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <button type="button" class="ghost" id="set-reset">Reset all progress</button>
        </div>
      </div>

      <!--
        The control list that used to sit here was read once, by someone who had
        not yet seen a wall to run along. The moves are taught in the run now,
        the first time each one comes up; this line only says how much is left.
      -->
      <p class="hint" id="tutorial-status"></p>
      <button type="button" class="start" id="start-button">Start race</button>
      <!-- Filled in by the boot watchdog in <head> when the module never runs. -->
      <p id="boot-error" class="boot-error" hidden></p>
      <p class="hint">Vaults and mantles fire on their own at speed. Slides and
        wall&#8209;jumps are yours to time &mdash; but a press is remembered for
        0.15&nbsp;s, so early and late both land.
        <span class="keys">Keyboard: arrows or WASD, space to jump.</span></p>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
