<!doctype html><html><head><meta charset="utf-8"><title>stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#f8f4ef;
  font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif}
/* warm wash so the card floats rather than sits on flat paper */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(70rem 40rem at 82% 8%, rgba(210,70,34,.13), transparent 68%),
   radial-gradient(52rem 34rem at 6% 100%, rgba(214,158,46,.16), transparent 66%)}
#viewport{position:fixed;inset:0;z-index:1;display:grid;place-items:center}
/* the browser card the site lives in */
#card{position:relative;width:1080px;height:620px;border-radius:18px;overflow:hidden;
  background:#f8f4ef;box-shadow:0 40px 90px -30px rgba(60,40,25,.42),0 8px 24px -12px rgba(60,40,25,.25);
  transition:transform 1.5s cubic-bezier(.45,.02,.2,1),opacity .8s ease;
  transform-origin:50% 50%}
#chrome{position:absolute;top:0;left:0;right:0;height:34px;z-index:3;
  background:#f1eae1;border-bottom:1px solid #e7ded3;display:flex;align-items:center;padding:0 14px;gap:7px}
.dot{width:10px;height:10px;border-radius:50%}
#bar{margin-left:12px;height:20px;flex:1;max-width:340px;border-radius:10px;background:#fff;
  border:1px solid #e7ded3;font:500 11px/20px ui-sans-serif;color:#9a8e80;text-align:center}
#clip{position:absolute;top:34px;left:0;right:0;bottom:0;overflow:hidden}
/* the camera: the iframe is bigger than the card and we move/scale it */
#cam{position:absolute;top:0;left:0;width:1080px;height:2400px;transform-origin:0 0;
  transition:transform 1.6s cubic-bezier(.45,.02,.2,1)}
iframe{width:1080px;height:2400px;border:0;display:block}
/* caption */
#cap{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:64px 70px 46px;text-align:center;
  background:linear-gradient(to top,#f8f4ef 0%,#f8f4ef 62%,rgba(248,244,239,.86) 82%,rgba(248,244,239,0) 100%);
  opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}
#cap.on{opacity:1;transform:none}
#cap b{display:block;font-size:36px;font-weight:600;letter-spacing:-.02em;color:#1a1714;line-height:1.12}
#cap span{display:block;margin-top:9px;font-size:19px;font-weight:400;color:#5b5349}
#cap em{font-style:normal;color:#b8412a}
/* full-screen title / end card */
#card2{position:fixed;inset:0;z-index:9;display:grid;place-content:center;justify-items:center;gap:20px;
  background:#f8f4ef;opacity:0;transition:opacity .7s ease;pointer-events:none;text-align:center}
#card2.on{opacity:1}
#card2 h1{font-size:96px;font-weight:600;letter-spacing:-.04em;color:#1a1714;line-height:.98}
#card2 .rule{width:70px;height:5px;border-radius:3px;background:#d24622}
#card2 p{font-size:25px;color:#5b5349;max-width:800px;line-height:1.4}
#card2 .dom{margin-top:6px;font-size:20px;color:#b8412a;font-weight:600;letter-spacing:.01em}
/* spotlight ring drawn over a feature */
#ring{position:fixed;z-index:6;border:2.5px solid #d24622;border-radius:14px;opacity:0;
  box-shadow:0 0 0 9999px rgba(26,23,20,.30);transition:opacity .5s ease,all .9s cubic-bezier(.45,.02,.2,1);pointer-events:none}
#ring.on{opacity:1}
</style></head><body>
<div id="viewport"><div id="card">
  <div id="chrome">
    <span class="dot" style="background:#e2694a"></span>
    <span class="dot" style="background:#e8b45c"></span>
    <span class="dot" style="background:#7fb069"></span>
    <div id="bar">playlocal.space</div>
  </div>
  <div id="clip"><div id="cam"><iframe id="site" src="http://localhost:4182/"></iframe></div></div>
</div></div>
<div id="cap"><b></b><span></span></div>
<div id="ring"></div>
<div id="card2"><h1></h1><div class="rule"></div><p></p><div class="dom"></div></div>
<script>
const cam=document.getElementById('cam'), card=document.getElementById('card'),
      cap=document.getElementById('cap'), c2=document.getElementById('card2'), ring=document.getElementById('ring');
const VW=1080, VH=620-34;
// Move the camera so page point (px,py) sits centred at scale s — clamped so
// the frame never runs off the page and shows bare white beside the content.
const PAGE_W=1080, PAGE_H=2400;
window.__cam=(px,py,s)=>{
  const halfW=(VW/2)/s, halfH=(VH/2)/s;
  // A little overshoot is fine now that the card matches the page colour, and
  // it is what lets an edge-hugging element still be framed centrally.
  const slackX=halfW*0.34, slackY=halfH*0.2;
  const cx = halfW*2>=PAGE_W ? PAGE_W/2 : Math.min(Math.max(px,halfW-slackX), PAGE_W-halfW+slackX);
  const cy = halfH*2>=PAGE_H ? PAGE_H/2 : Math.min(Math.max(py,halfH-slackY), PAGE_H-halfH+slackY);
  cam.style.transform=`scale(${s}) translate(${halfW-cx}px, ${halfH-cy}px)`;
};
window.__cap=(t,sub)=>{ if(t===null){cap.classList.remove('on');return;}
  cap.querySelector('b').innerHTML=t; cap.querySelector('span').innerHTML=sub||''; cap.classList.add('on'); };
window.__card=(h,p,d)=>{ if(h===null){c2.classList.remove('on');return;}
  c2.querySelector('h1').innerHTML=h; c2.querySelector('p').innerHTML=p||'';
  c2.querySelector('.dom').innerHTML=d||''; c2.classList.add('on'); };
window.__ring=(r)=>{ if(!r){ring.classList.remove('on');return;}
  Object.assign(ring.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'}); ring.classList.add('on'); };
window.__tilt=(deg,sc)=>{ card.style.transform=`perspective(1800px) rotateY(${deg}deg) scale(${sc})`; };
</script></body></html>
