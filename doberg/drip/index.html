<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drip · Doberg</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Something is dripping.">
<meta name="theme-color" content="#FFF9F2">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF9F2;--ink:#201A17;--muted:#6E6259;--coral:#FF4B2E;--coral-deep:#C2410C;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px;overflow-x:hidden}
main{width:100%;max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.tag{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(255,75,46,.1);color:var(--coral-deep);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.drop{width:64px;height:86px;position:relative;animation:fall 3.2s var(--ease) infinite}
.drop svg{width:100%;height:100%;display:block}
@keyframes fall{0%{transform:translateY(-14px) scale(.92);opacity:0}18%{opacity:1}62%{transform:translateY(14px) scale(1)}100%{transform:translateY(34px) scale(.96);opacity:0}}
.ripple{width:84px;height:12px;border-radius:50%;border:2px solid var(--coral);margin-top:-12px;opacity:0;animation:ripple 3.2s var(--ease) infinite}
@keyframes ripple{0%,60%{transform:scale(.2);opacity:0}70%{opacity:.7}100%{transform:scale(1.4);opacity:0}}
h1{margin:6px 0 0;font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;font-weight:800;font-size:clamp(56px,16vw,112px);line-height:.92;letter-spacing:-.04em}
h1 span{color:var(--coral)}
p{margin:0;color:var(--muted);max-width:26em;font-size:18px}
a.back{margin-top:10px;display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(32,26,23,.85);transition:background .5s var(--ease)}
a.back:hover{background:rgba(32,26,23,.05)}
@media (prefers-reduced-motion:reduce){.drop,.ripple{animation:none}.drop{opacity:1}}
</style>
</head>
<body>
<main>
  <span class="tag">Doberg · Not public</span>
  <div class="drop" aria-hidden="true">
    <svg viewBox="0 0 64 86" fill="none"><path d="M32 2C32 2 6 34 6 56a26 26 0 0 0 52 0C58 34 32 2 32 2Z" fill="#FF4B2E"/><path d="M19 56a13 13 0 0 0 10 12.6" stroke="#FFF9F2" stroke-width="4" stroke-linecap="round" opacity=".7"/></svg>
  </div>
  <div class="ripple" aria-hidden="true"></div>
  <h1>Drip<span>.</span></h1>
  <p>Something is on its way. You found this early.</p>
  <a class="back" href="../">Back to Doberg</a>
</main>
</body>
</html>
