<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stride — track every mile</title>
  <meta name="description" content="Stride: a Strava-style activity tracker — live GPS recording, feed, routes, splits, elevation and weekly training charts.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23cf4514'/%3E%3Cpath d='M9 22c5 2 9 1 9-2 0-4-8-3-8-7 0-3 4-4 8-2' stroke='%23fff' stroke-width='3' stroke-linecap='round' fill='none'%3E%3C/path%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#cf4514">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Stride">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/feed" aria-label="Stride home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="#cf4514"/><path d="M9 22c5 2 9 1 9-2 0-4-8-3-8-7 0-3 4-4 8-2" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
        </span>
        <span class="brand-name">Stride</span>
      </a>
      <nav class="tabs" aria-label="Primary">
        <a href="#/feed" data-tab="feed">Feed</a>
        <a href="#/progress" data-tab="progress">Progress</a>
        <a href="#/profile" data-tab="profile">Profile</a>
      </nav>
      <a class="btn btn-accent record-btn" href="#/record">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        Record
      </a>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="bottombar" aria-label="Primary, mobile">
    <a href="#/feed" data-tab="feed">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 5.5h16M4 12h16M4 18.5h10"/></svg>
      <span>Feed</span>
    </a>
    <a href="#/progress" data-tab="progress">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M21 20H3"/></svg>
      <span>Progress</span>
    </a>
    <a class="bb-record" href="#/record" aria-label="Record an activity">
      <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </a>
    <a href="#/profile" data-tab="profile">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M4.5 20c1-4 4-5.5 7.5-5.5s6.5 1.5 7.5 5.5"/></svg>
      <span>Profile</span>
    </a>
  </nav>

  <div id="tooltip" class="viz-tooltip" role="status" aria-live="polite" hidden></div>

  <script src="vendor/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('sw.js').catch(function () { /* offline shell is optional */ });
    }
  </script>
</body>
</html>
