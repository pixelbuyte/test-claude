<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stride — track every mile</title>
  <meta name="description" content="Stride: a Strava-style activity tracker demo — feed, routes, splits, elevation and weekly training charts.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23cf4514'/%3E%3Cpath d='M9 22c5 2 9 1 9-2 0-4-8-3-8-7 0-3 4-4 8-2' stroke='%23fff' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/feed" aria-label="Stride home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="#cf4514"/><path d="M9 22c5 2 9 1 9-2 0-4-8-3-8-7 0-3 4-4 8-2" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
        </span>
        <span class="brand-name">Stride</span>
      </a>
      <nav class="tabs" aria-label="Primary">
        <a href="#/feed" data-tab="feed">Feed</a>
        <a href="#/progress" data-tab="progress">Progress</a>
        <a href="#/profile" data-tab="profile">Profile</a>
      </nav>
      <a class="btn btn-accent record-btn" href="#/record">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        Record
      </a>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <div id="tooltip" class="viz-tooltip" role="status" aria-live="polite" hidden></div>

  <script src="vendor/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
